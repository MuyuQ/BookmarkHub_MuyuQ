name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: WXT prepare (generate types)
        run: npx wxt prepare

      - name: TypeScript compile check
        run: npm run compile

      - name: Validate locale files
        run: npm run validate:locales

      - name: Unit tests
        run: npm test

      - name: Build (Chrome MV3)
        run: npm run build

      - name: Build (Firefox)
        run: npm run build:firefox
